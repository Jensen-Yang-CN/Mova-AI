distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 三处地址内容一致，可按网络情况切换：
#   https://services.gradle.org/distributions/gradle-8.13-bin.zip         官方
#   https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.13-bin.zip
#   https://mirrors.cloud.tencent.com/gradle/gradle-8.13-bin.zip
#
# 默认使用阿里云镜像：在部分网络环境下（代理 / 企业网关），JVM 直连官方地址
# 会在 TLS 握手阶段收到 Connection reset，而镜像站稳定可用（已实测下载完成）。
distributionUrl=https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.13-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
