# ============================================================
# Mova-AI · Gradle 项目级配置
# IDE（Android Studio）里的设置会覆盖本文件
# ============================================================

# 编译 Compose + Kotlin 需要比默认更多的堆内存，否则容易 OOM
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Kotlin 增量编译守护进程内存
kotlin.daemon.jvmargs=-Xmx2048m

# 构建缓存与并行
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ------------------------------------------------------------
# ⚠️ 本仓库路径包含中文（移动AI生活助手）。
# AGP 默认会因路径含非 ASCII 字符而直接中止构建（b.android.com/95744）。
# 这里显式关闭该校验 —— 实测在本机 JDK 21 + AGP 8.13.1 下可以正常构建。
# 若你把项目移到纯英文路径下，可以删掉这一行。
# ------------------------------------------------------------
android.overridePathCheck=true

android.useAndroidX=true
android.nonTransitiveRClass=true
